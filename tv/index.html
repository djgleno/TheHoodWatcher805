<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hoodwatcher 805 TV</title><style>body{margin:0;background:#10131c;color:white;font:22px system-ui;padding:5vw}h1{font-size:clamp(2rem,5vw,5rem)}b{color:#ff5868}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}button{background:#273041;border:3px solid #596477;border-radius:14px;color:white;font-size:1.3rem;padding:45px 20px;text-align:left;cursor:pointer}button:focus{outline:5px solid #ff5868}small{color:#cbd2de}#message{margin-top:35px}</style></head><body><small>GREENEDGE MEDIA GROUP PRESENTS</small><h1>THE HOODWATCHER <b>805</b></h1><p>Independent news • investigations • travel and entertainment</p><div class="grid"><button>805 News</button><button>The Watchdog</button><button>After Dark</button><button>On the Road</button></div><p id="message" aria-live="polite">Video programming is being prepared. No stream is live yet.</p><script>const buttons=[...document.querySelectorAll('button')];buttons.forEach((b,i)=>b.addEventListener('click',()=>document.querySelector('#message').textContent=b.textContent+': videos coming soon'));document.addEventListener('keydown',e=>{let i=buttons.indexOf(document.activeElement);if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();if(i<0)i=0;else i=(i+({'ArrowRight':1,'ArrowLeft':-1,'ArrowDown':2,'ArrowUp':-2}[e.key])+buttons.length)%buttons.length;buttons[i].focus()}if(e.key==='Enter'&&i>=0)buttons[i].click()});buttons[0].focus()</script></body></html>
